apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-assistant
  template:
    metadata:
      labels:
        app: hr-assistant
    spec:
      # The 5 s preStop sleep counts against this, which leaves 40 s for answers in flight.
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          # The deploy command in README.md puts a short commit here, so each rollout names one immutable image.
          image: ghcr.io/mazzsva/hr-assistant:sha-COMMIT
          ports:
            - containerPort: 3000
          # The Service drops the pod asynchronously, so the pod keeps serving for 5 s before it gets SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          envFrom:
            - secretRef:
                name: hr-assistant
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Boot migrates and ingests before it listens, so allow a minute.
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 3
            failureThreshold: 20
          # No liveness probe: /healthz needs Postgres, and a database outage must not restart every pod.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hr-assistant
spec:
  selector:
    app: hr-assistant
  ports:
    - port: 80
      targetPort: 3000
